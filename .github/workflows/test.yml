name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # 跳过需要 ES / 模型 / Ollama 的重型测试（见 test/conftest.py）
      RAG_SKIP_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run unit tests
        run: pytest -v
