services:
  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.es
    image: rag-es:8.17.0
    container_name: rag-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag-app:
    build: .
    container_name: rag-app
    ports:
      - "6010:6010"
    environment:
      - ES_HOST=elasticsearch
      - RAG_API_KEY=rag-dev-key
    volumes:
      - D:/AILLM/Week04/models:/models                      # 模型挂载
      - ./config.docker.yaml:/app/config.yaml              # 覆盖容器内配置
      - ./upload_files:/app/upload_files
      - ./rag.db:/app/rag.db
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  es_data:
