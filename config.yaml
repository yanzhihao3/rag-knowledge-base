elasticsearch:
  host: "localhost"
  port: 9200
  scheme: "http"
  username: ""
  password: ""

database:
  engine: "mysql"         # 默认 MySQL；改回 "sqlite" 即可继续用本地 rag.db
  path: "rag.db"          # 仅 engine=sqlite 时使用
  host: "localhost"       # 仅 engine=mysql 时使用
  port: 3306
  username: "root"
  password: ""            # 真实密码从 .env 或环境变量 RAG_DB_PASSWORD 读取，勿提交
  database: "rag"

models:
  embedding_model:
    bge-small-zh-v1.5:
      hf_url: "https://huggingface.co/BAAI/bge-small-zh-v1.5"
      local_url: "D:/AILLM/Week04/models/BAAI/bge-small-zh-v1.5/"
      dims: 512

  rerank_model:
    bge-reranker-base:
      hf_url: "https://huggingface.co/BAAI/bge-rerank-base"
      local_url: "D:/AILLM/Week04/models/BAAI/bge-reranker-base/"

  llm:
    config:
      temperature: 0.1
      top_p: 1
      max_token_to_sample: 1024
    base_model:
      glm:
        tokens: ""
      qwen:
        tokens: ""
      gpt:
        tokens: ""


device: "cpu"

rag:
  # llm_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # DashScope 外部 API
  # llm_api_key: ""
  # llm_model: "qwen-max"  # 或者 "qwen-plus"
  llm_base: "http://localhost:11434/v1"   # 本地 Ollama
  llm_api_key: "ollama"
  api_key: "rag-dev-key"
  llm_model: "qwen2.5:1.5b"
  embedding_model: "bge-small-zh-v1.5"
  rerank_model: "bge-reranker-base"
  # 分块策略：semantic = 视觉行拼回 + 按句边界聚合（推荐）；
  # fixed = 旧的定长字符切分，保留用于复现旧基线（chunk_size 256 / chunk_overlap 20）
  chunk_strategy: "semantic"
  chunk_size: 400            # semantic: 目标块大小（字）；fixed: 字符窗口
  chunk_overlap_sentences: 1 # semantic: 块间整句重叠数
  chunk_overlap: 20          # fixed: 字符重叠
  chunk_candidate: 10
  rerank_top_k: 5
  # 检索模式：flat = 页级块与子块同池竞争（改前行为）；
  # parent_child = 只在子块上召回，再按页聚合并把整页正文送去生成。
  # 可用环境变量覆盖做 A/B：$env:RAG_RETRIEVAL_MODE='parent_child'
  retrieval_mode: "flat"
  parent_max_chars: 1200     # parent_child: 父块送进 Prompt 前截断到多少字
  use_embedding: true
  use_rerank: true
  use_rrf: true
  port: 6010
