elasticsearch:
  host: "elasticsearch"          # 容器内通过服务名访问 ES
  port: 9200
  scheme: "http"
  username: ""
  password: ""

database:
  engine: "sqlite"        # Docker 默认沿用 sqlite；上线切 MySQL 时改为 "mysql"
  path: "rag.db"          # 仅 engine=sqlite 时使用
  host: "mysql"           # 仅 engine=mysql 时使用（compose 服务名）
  port: 3306
  username: "rag"
  password: ""            # 生产环境用环境变量 RAG_DB_PASSWORD 注入
  database: "rag"

models:
  embedding_model:
    bge-small-zh-v1.5:
      hf_url: "https://huggingface.co/BAAI/bge-small-zh-v1.5"
      local_url: "/models/BAAI/bge-small-zh-v1.5/"   # 容器内挂载路径
      dims: 512

  rerank_model:
    bge-reranker-base:
      hf_url: "https://huggingface.co/BAAI/bge-rerank-base"
      local_url: "/models/BAAI/bge-reranker-base/"   # 容器内挂载路径

  llm:
    config:
      temperature: 0.1
      top_p: 1
      max_token_to_sample: 1024
    base_model:
      glm:
        tokens: ""
      qwen:
        tokens: ""
      gpt:
        tokens: ""

device: "cpu"

rag:
  llm_base: "http://host.docker.internal:11434/v1"   # 容器内访问宿主机 Ollama
  llm_api_key: "ollama"
  api_key: "rag-dev-key"
  llm_model: "qwen2.5:1.5b"
  embedding_model: "bge-small-zh-v1.5"
  rerank_model: "bge-reranker-base"
  chunk_size: 256
  chunk_overlap: 20
  chunk_candidate: 10
  rerank_top_k: 5
  use_embedding: true
  use_rerank: true
  use_rrf: true
  port: 6010
